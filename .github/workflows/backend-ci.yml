name: backend-ci

on:
    push:
        branches: [main, dev]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on:
            ubunutu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            - name: Install dependencies
              working-directory: backend
              run: uv sync --frozen
            - name: Lock is up to date
              working-directory: backend
              run: uv lock --check
            - name: Ruff lint
              working-directory: backend
              run: uv run ruff check .
            - name: Ruff format
              working-directory: backend
              run: uv run ruff format -- check .
        
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                db: [sqlite, postgres]
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U test -d test"
                    --health-interval 2s
                    --health-timeout 3s
                    --health-retries 10
        env:
            SECRET_KEY: ci-only-not-a-real-secret-for-tests
            DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://test:test@localhost:5432/test' || 'sqlite+aiosqlite:///./test.db' }}
        steps:
        - uses: actions/checkout@v5
        - uses: astral-sh/setup-uv@v5
          with:
            enable-cache: true
        - working-directory: backend
          run: uv sync --frozen
        - name: Pytest (${{ matrix.db }})
          working-directory: backend
          run: uv run pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80